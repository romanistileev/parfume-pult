  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

<script>
/* ================= БАЗА ================= */
const TABS = [["overview", "Обзор", "1"], ["today", "Сегодня", "T"], ["rnp", "РНП по дням", "D"], ["unit", "Юнитка", "2"], ["sku", "Артикул", "3"], ["traffic", "Трафик", "4"], ["comp", "Конкуренты", "5"], ["ads", "Реклама", "6"],
  ["search", "Поиск", "7"], ["wh", "Склады", "8"], ["glue", "Склейки", "9"], ["novel", "Новинки и пары", "N"], ["aud", "Аудитория", "A"], ["cmp", "Сравнение ЛК", "0"], ["recs", "Рекомендации", "R"]];
const cap = async n => { try { return (await window.claude?.use?.(n)) ?? null; } catch (e) { return null; } };
const D = {}; const st = { tab: "overview", nm: null, period: "30", sort: {}, filters: {}, usub: "table", asub: "camps", tsub: "own", rsub: "nm", gran: "d", pd: "sum", scope: "nm", nsub: "cand", pp: "7", pc: "prev" };
try { Object.assign(st, JSON.parse(localStorage.getItem("pult2") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("pult2", JSON.stringify({ tab: st.tab, nm: st.nm, period: st.period, usub: st.usub, asub: st.asub, tsub: st.tsub,
  rsub: st.rsub, gran: st.gran, rngd: st.rngd, rngw: st.rngw, pd: st.pd, scope: st.scope, rmet: st.rmet, rtop: st.rtop, rflt: st.rflt, amet: st.amet, anm: st.anm, cmet: st.cmet, kmet: st.kmet, nsub: st.nsub, pp: st.pp, pa: st.pa, pb: st.pb, pc: st.pc })); } catch (e) {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const N = (v, d = 0) => { if (typeof d !== "number") d = 0; return v == null || v === "" || isNaN(v) ? "—" : Number(v).toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: 0 }); };
const P = (a, b) => (a != null && b) ? (a / b - 1) * 100 : null;
const dlt = (v, inv = false, unit = "%") => v == null || !isFinite(v) ? "" : `<span class="d ${v === 0 ? "" : ((v > 0) !== inv ? "up" : "dn")}">${v > 0 ? "+" : ""}${N(v, Math.abs(v) < 10 ? 1 : 0)}${unit}</span>`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtD = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) : "";
const money = v => N(v); const pct = v => v == null ? "—" : N(v, 1) + "%";
const netCls = v => v == null ? "—" : `<span class="${v < 0 ? "dn" : ""}">${N(v)}</span>`;
const vcLink = (v, r) => r && r.nm ? `<a class="lnk" data-go="${r.nm}">${esc(v)}</a>` : esc(v);
const abcPill = v => v && v !== "—" ? `<span class="pill p-${v}">${v}</span>` : "—";
const pill = (t, c) => `<span class="pill p-${c}">${esc(t)}</span>`;
let charts = [], AFTERQ = [];
const killCharts = () => { charts.forEach(c => c.destroy()); charts = []; };
const after = f => AFTERQ.push(f);

async function load() {
  const names = ["meta", "sku", "series", "total", "ads", "search", "market", "compare", "glue", "recs", "reviews", "traffic", "clusters", "wh", "unitx"];
  await Promise.all(names.map(async n => { try { D[n] = await getData(n); } catch (e) { D[n] = null; } }));
  D.byNm = Object.fromEntries((D.sku || []).map(s => [s.nm, s]));
  D.order = (D.sku || []).slice().sort((a, b) => (b.p30?.orders || 0) - (a.p30?.orders || 0)).map(s => s.nm);
  D.camp = Object.fromEntries((D.ads || []).map(c => [c.id, c]));
  if (!st.nm || !D.byNm[st.nm]) st.nm = D.order[0];
  $("#built").textContent = "данные на " + (D.meta?.built || "—");
  nav(); render();
}
function nav() {
  const a = $("#nav"); a.querySelectorAll("button").forEach(b => b.remove());
  TABS.forEach(([k, t, key]) => { const b = document.createElement("button"); b.innerHTML = `<span>${t}</span><kbd>${key}</kbd>`; b.setAttribute("aria-current", st.tab === k); b.onclick = () => go(k); a.appendChild(b); });
  const h = document.createElement("button"); h.className = "help"; h.innerHTML = `<span>Справка</span><kbd>?</kbd>`; h.onclick = help; a.appendChild(h);
}
function go(tab, nm) { if (tab) st.tab = tab; if (nm) st.nm = +nm; save(); nav(); render(); window.scrollTo(0, 0); }
function render() {
  killCharts(); AFTERQ = []; const v = $("#view"); try { pbar(); } catch (e) { console.error(e); }
  try { v.innerHTML = (VIEWS[st.tab] || VIEWS.overview)(); const q = AFTERQ; AFTERQ = []; q.forEach(f => f()); bind(v); v.querySelectorAll("[data-end]").forEach(el => el.scrollLeft = el.scrollWidth); }
  catch (e) { v.innerHTML = `<div class="card">Ошибка отображения: ${esc(e.message)}</div>`; console.error(e); }
}

/* ---------- таблицы ---------- */
const TBL = {};
function T(id, cols, rows, opt = {}) {
  const s = st.sort[id];
  if (s) rows = rows.slice().sort((a, b) => { const x = a[s.k], y = b[s.k]; if (x == null || x === "") return 1; if (y == null || y === "") return -1; return (typeof x === "string" ? x.localeCompare(y, "ru") : x - y) * s.d; });
  TBL[id] = { cols, rows };
  const h = cols.map(c => `<th data-k="${c[0]}" class="${c[3] || ""}" ${s && s.k === c[0] ? `data-s="${s.d > 0 ? "▲" : "▼"}"` : ""} ${c[4] ? `title="${esc(c[4])}"` : ""}>${c[1]}</th>`).join("");
  const b = rows.map(r => `<tr class="${opt.click ? "click" : ""} ${opt.me && opt.me(r) ? "me" : ""} ${opt.sel && opt.sel(r) ? "sel" : ""}" ${opt.click ? `data-nm="${r.nm ?? ""}" data-id="${esc(r.id ?? "")}"` : ""}>` +
    cols.map(c => `<td class="${c[3] || ""}">${c[2] ? c[2](r[c[0]], r) : esc(r[c[0]] ?? "—")}</td>`).join("") + "</tr>").join("");
  return `<div class="row sp"><span class="meta">${rows.length} строк${opt.hint ? " · " + opt.hint : ""}</span><button class="btn" data-csv="${id}">CSV</button></div>
  <div class="tw" ${opt.end !== false && /^rnp(all|ads|kw|cl)$/.test(id) ? 'data-end="1"' : ""} style="${opt.h ? "max-height:" + opt.h + "px" : ""}"><table data-t="${id}" data-click="${opt.click || ""}"><thead><tr>${h}</tr></thead><tbody>${b || `<tr><td colspan="${cols.length}" class="l meta">нет данных</td></tr>`}</tbody></table></div>`;
}
function bind(root) {
  root.querySelectorAll("table[data-t] thead th").forEach(th => th.onclick = () => { const id = th.closest("table").dataset.t, k = th.dataset.k, s = st.sort[id]; st.sort[id] = { k, d: s && s.k === k ? -s.d : -1 }; render(); });
  root.querySelectorAll("table[data-click] tbody tr.click").forEach(tr => tr.onclick = e => {

function simCalc() {
  const v = id => +($("#" + id)?.value || 0); const s = D.byNm[st.simnm], p = s.pnl30;
  const price = v("s_price"), spp = v("s_spp") / 100, k = v("s_k") / 100, bp = price * (1 - spp);
  const pay = price * (1 - k), ind = price * v("s_ind") / 100, tax = bp * v("s_tax") / 100 + bp * v("s_nds") / (100 + v("s_nds"));
  const net = pay - v("s_log") - v("s_cost") - v("s_ads") - v("s_pen") - ind - tax;
  const bp0 = p.rev1 || bp; const dq = -(bp / bp0 - 1) * 100 * v("s_el"); const qty = v("s_qty") * (1 + dq / 100);
  const net0 = p.net1, qty0 = v("s_qty");
  $("#simOut").innerHTML = `<h2>Результат</h2><div class="kpis">
    <div class="kpi"><span class="l">Цена покупателя</span><span class="v">${N(bp)} ₽</span>${dlt(P(bp, bp0))}</div>
    <div class="kpi"><span class="l">К перечислению</span><span class="v">${N(pay)} ₽</span></div>
    <div class="kpi"><span class="l">Прибыль на шт</span><span class="v ${net < 0 ? "dn" : ""}">${N(net)} ₽</span><span class="meta">факт: ${N(net0)} ₽</span></div>
    <div class="kpi"><span class="l">Продаж в месяц</span><span class="v">${N(qty)}</span>${dlt(dq)}</div>
    <div class="kpi"><span class="l">Прибыль в месяц</span><span class="v ${net < 0 ? "dn" : ""}">${N(net * qty)} ₽</span><span class="meta">сейчас ≈ ${N(net0 * qty0)} ₽</span></div>
    <div class="kpi"><span class="l">Изменение прибыли</span><span class="v">${dlt(net * qty - net0 * qty0, false, " ₽")}</span></div></div>`;
}

/* ---------- режим сайта (GitHub Pages): пароль команды, шифрованные данные, заметки в GitHub ---------- */
let KEY = null;
const b64u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function deriveKey(pw, E) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64u8(E.salt), iterations: E.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
const decBytes = (key, u8) => crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, key, u8.slice(12));
async function getData(n) {
  const E = window.PULT_ENC;
  if (!E) return (await fetch(`data/${n}.json${window.PULT_V ? "?v=" + window.PULT_V : ""}`)).json();
  const u8 = new Uint8Array(await (await fetch(`data/${n}.bin?v=${E.v}`)).arrayBuffer());
  const plain = await decBytes(KEY, u8);
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
function askPw(tryPw) {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "ov";
    o.innerHTML = `<div class="card" style="max-width:380px;width:100%;overflow:hidden"><h2>Пульт parfume de Paris</h2><p class="meta">Введите пароль команды. Он запомнится на этом устройстве.</p>
      <input class="inp" id="pwIn" type="password" autocomplete="current-password" placeholder="Пароль" style="width:100%"><div class="row"><button class="btn pri" id="pwGo">Войти</button><span class="meta" id="pwSt"></span></div></div>`;
    document.body.append(o); const inp = o.querySelector("#pwIn"), st_ = o.querySelector("#pwSt"); inp.focus();
    const go = async () => { st_.textContent = "Проверяю…"; const k = await tryPw(inp.value); if (!k) { st_.textContent = "Неверный пароль"; inp.select(); return; }
      try { localStorage.setItem("pult_pw", inp.value); } catch (e) {} o.remove(); res(k); };
    o.querySelector("#pwGo").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}
async function boot() {
  const E = window.PULT_ENC; if (!E) return load();
  const tryPw = async pw => { if (!pw) return null; try { const k = await deriveKey(pw, E); await decBytes(k, b64u8(E.check)); return k; } catch (e) { return null; } };
  let pw = null; try { pw = localStorage.getItem("pult_pw"); } catch (e) {}
  KEY = (await tryPw(pw)) || await askPw(tryPw);
  if (E.notes?.tok) { try { GN.tok = new TextDecoder().decode(await decBytes(KEY, b64u8(E.notes.tok))); GN.repo = E.notes.repo; } catch (e) {} }
  load();
}
/* заметки команды и статусы складов — комментарии в закрытом репозитории GitHub */
const myName = () => { try { return localStorage.getItem("pult_name") || ""; } catch (e) { return ""; } };
const setName = v => { try { localStorage.setItem("pult_name", v); } catch (e) {} };
const GN = { tok: null, repo: null, nums: null,
  on() { return !!(this.tok && this.repo); },
  async api(path, opt = {}) {
    const r = await fetch(`https://api.github.com/repos/${this.repo}${path}`, { ...opt, headers: { Authorization: `Bearer ${this.tok}`, Accept: "application/vnd.github+json", ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
    if (!r.ok) throw new Error("GitHub ответил " + r.status); return r.status === 204 ? null : r.json(); },
  async issues() { if (this.nums) return this.nums; const m = {};
    for (let p = 1; p <= 20; p++) { const a = await this.api(`/issues?state=all&per_page=100&page=${p}`); a.forEach(i => m[i.title] = i.number); if (a.length < 100) break; }
    return this.nums = m; },
  async issue(title, body) { const m = await this.issues(); if (m[title]) return m[title];
    const i = await this.api("/issues", { method: "POST", body: JSON.stringify({ title, body: body || title }) }); return m[title] = i.number; },
  parse(c) { const b = c.body || "", m = /<!--\s*(\{[\s\S]*?\})\s*-->/.exec(b); let meta = {}; try { meta = m ? JSON.parse(m[1]) : {}; } catch (e) {}
    const text = b.replace(/<!--[\s\S]*?-->\s*/, "").replace(/^\*\*[^\n]*\n+/, "").trim(); return { ...meta, id: c.id, at: meta.at || c.created_at, text }; },
  async list(title) { const m = await this.issues(); if (!m[title]) return []; const out = [];
    for (let p = 1; p <= 10; p++) { const a = await this.api(`/issues/${m[title]}/comments?per_page=100&page=${p}`); out.push(...a.map(c => this.parse(c))); if (a.length < 100) break; }
    return out; },
  async add(title, meta, issueBody, text) { const n = await this.issue(title, issueBody);
    const body = `<!-- ${JSON.stringify(meta).replace(/--/g, "- -")} -->\n**${(meta.by || "Участник").replace(/[*\n]/g, "")}** · ${fmtTs(meta.at)}\n\n${text}`;
    return this.parse(await this.api(`/issues/${n}/comments`, { method: "POST", body: JSON.stringify({ body }) })); },
  del(id) { return this.api(`/issues/comments/${id}`, { method: "DELETE" }); },
  async latest(k) { const a = await this.api(`/issues/comments?sort=created&direction=desc&per_page=${k * 3}`); return a.map(c => this.parse(c)).filter(x => x.nm).slice(0, k); }
};
async function notesGH() {
  const ta = $("#noteTxt"), bt = $("#noteSave"), stt = $("#noteSt"), list = $("#noteList"), who = $("#noteWho"), nm = st.nm; if (!ta) return;
  who.innerHTML = ""; const nIn = document.createElement("input"); nIn.className = "inp"; nIn.placeholder = "Ваше имя для подписи"; nIn.value = myName(); nIn.onchange = () => setName(nIn.value.trim()); who.append(nIn);
  const draw = async () => {
    let items = []; try { items = await GN.list("nm:" + nm); } catch (e) { list.innerHTML = `<p class="meta">Заметки не загрузились: ${esc(e.message)}</p>`; return; }
    if (st.nm !== nm || !document.body.contains(list)) return;
    items.sort((a, b) => String(b.at).localeCompare(String(a.at)));
    list.innerHTML = items.length ? "" : '<p class="meta">Заметок пока нет.</p>';
    items.forEach(x => { const d = document.createElement("div"); d.className = "note-i"; const h = document.createElement("div"); h.className = "meta"; h.textContent = `${x.by || "Участник"} · ${fmtTs(x.at)}`;
      if (x.by && x.by === myName()) { const del = document.createElement("a"); del.className = "lnk"; del.textContent = "удалить"; del.onclick = async () => { try { await GN.del(x.id); draw(); } catch (e) { stt.textContent = "Не удалилось: " + e.message; } }; h.append(" · ", del); }
      const t = document.createElement("div"); t.style.whiteSpace = "pre-wrap"; t.textContent = x.text; d.append(h, t); list.append(d); });
  };
  bt.onclick = async () => { const text = ta.value.trim(); if (!text) return; const by = (nIn.value || "").trim(); if (!by) { stt.textContent = "Укажите имя — так команда поймёт, кто написал"; nIn.focus(); return; }
    setName(by); bt.disabled = true;
    try { await GN.add("nm:" + nm, { nm, vc: D.byNm[nm]?.vc || String(nm), by, at: new Date().toISOString() }, `${D.byNm[nm]?.vc || nm} · ${nm}`, text); ta.value = ""; stt.textContent = "Добавлено — видно всей команде"; await draw(); }
    catch (e) { stt.textContent = "Не сохранилось: " + e.message; }
    bt.disabled = false; };
  draw();
}
async function teamNotesGH() {
  const box = $("#teamNotes"); if (!box) return; let items = [];
  try { items = await GN.latest(8); } catch (e) { box.innerHTML = `<p class="meta">Заметки не загрузились: ${esc(e.message)}</p>`; return; }
  if (!document.body.contains(box)) return;
  box.innerHTML = items.length ? "" : '<p class="meta">Пока нет. Заметки добавляются внизу страницы артикула.</p>';
  items.forEach(x => { const d = document.createElement("div"); d.className = "note-i"; const h = document.createElement("div"); h.className = "meta";
    const a = document.createElement("a"); a.className = "lnk"; a.textContent = x.vc || String(x.nm); a.onclick = () => go("sku", x.nm);
    h.append(a, ` · ${x.by || "Участник"} · ${fmtTs(x.at)}`); const t = document.createElement("div"); t.style.whiteSpace = "pre-wrap"; t.textContent = x.text; d.append(h, t); box.append(d); });
}
async function whStatusGH() {
  const stt = $("#whst"), sels = document.querySelectorAll("select[data-wh]"); let items = [];
  try { items = await GN.list("wh"); } catch (e) { if (stt) stt.textContent = "Статусы не загрузились: " + e.message; }
  const m = {}; items.sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(x => { if (x.wh) m[x.wh] = x.v || ""; });
  sels.forEach(s => { s.value = m[s.dataset.wh] || ""; s.onchange = async () => { const name = s.closest(".row").firstElementChild.textContent;
    try { await GN.add("wh", { wh: s.dataset.wh, v: s.value, by: myName(), at: new Date().toISOString() }, "Статусы складов", `${name}: ${s.value || "не проверено"}`); if (stt) stt.textContent = "Сохранено — видно всей команде"; }
    catch (e) { if (stt) stt.textContent = "Не сохранилось: " + e.message; } }; });
}

/* ---------- СПРАВКА ---------- */
function help() {
  const o = $("#help"); o.hidden = false;
  o.innerHTML = `<div class="card"><div class="row sp"><h2>Справка</h2><button class="btn" id="hclose">Закрыть (Esc)</button></div>
  <p><b>Клавиши:</b> <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> — разделы, <kbd>D</kbd> — РНП по дням, <kbd>N</kbd> — новинки и пары, <kbd>A</kbd> — аудитория и инфографика, <kbd>R</kbd> — рекомендации, <kbd>/</kbd> — поиск артикула, <kbd>←</kbd> <kbd>→</kbd> — соседний артикул, <kbd>?</kbd> — справка. Клик по заголовку колонки — сортировка, по строке — провал внутрь, «CSV» — выгрузка таблицы.</p>
  <p><b>Период:</b> вверху страницы — «Вчера», «Последние 2 дня», 7, 14, 30, 90 дней, прошлая неделя, этот или прошлый месяц, или свои даты. Обзор, РНП, Юнитка (воронка и реклама), Артикул, Реклама и Склейки считаются за этот период и сравниваются с предыдущим периодом такой же длины — или с теми же днями недели раньше (удобно для «вчера к прошлому вторнику»). Если сравниваемый период короче (не хватает истории), изменение считается в среднем за день. Разделы с данными MPSTATS и поиска WB работают за свои фиксированные окна — это подписано в разделе.</p>
  <p><b>Для команды:</b> данные обновляет владелец — фразой «обнови пульт» в Claude; дата обновления — слева вверху. Заметки по артикулу (внизу страницы артикула) и отметки складов видны всем и подписаны автором; добавлять их могут люди с правом редактирования, остальные только смотрят. Пульт открывается по ссылке как обычный сайт; общие заметки видны тем, кто вошёл в Claude, а писать их могут владелец и редакторы — остальные ведут личные заметки (хранятся в их браузере). Выбранный период и вкладка запоминаются у каждого свои.</p>
  <p><b>РНП:</b> воронка, цена, реклама, поиск и прибыль по каждому артикулу по дням; переключатели «Дни / Недели / Месяцы» сворачивают те же цифры, «В день» делает неполные периоды сравнимыми. Цвет клетки — лучше или хуже предыдущего периода (с учётом смысла: рост ДРР — плохо). Прибыль по дням — оценка по заказам дня с фактическим выкупом, удержаниями и логистикой артикула за 5 недель; в неделях и месяцах рядом — факт отчёта реализации. Вкладки РНП: «Все артикулы» (любой показатель по всем карточкам), «Реклама» (кампании, их артикулы и кластеры по дням), «Ключи и позиции» (позиция по каждому запросу по дням, вы и конкуренты).</p>
  <p><b>Новинки и пары:</b> спрос — запросы ниши «Духи» за 30 дней (MPSTATS) с прошлым месяцем для динамики; рынок — карточки аналогов до 1 500 ₽; пары — заказы из одной корзины WB за 120 дней и составы наборов у конкурентов.</p>
  <p><b>Модель прибыли:</b> ${esc(D.meta?.model?.note || "")}</p>
  <p><b>Источники:</b> WB API — воронка по дням (агрегаты), поисковые запросы и итоги поиска, статистика кампаний и поисковых кластеров, лента заказов, отчёт реализации, тарифы. MPSTATS — рынок по ароматам, позиции по ключам (органика/реклама) свои и конкурентов, продажи конкурентов, отзывы. Файлы — себестоимость, склейки, «Сравнение карточек», таблица «Аналитика продаж».</p>
  <p><b>Термины:</b> переходы — открытия карточки; CR корз. — корзины/переходы; CR заказ — заказы/корзины; CPO — расход/заказы; ДРР — расход/сумма заказов; полки — реклама в рекомендациях; ассоц. заказы — после рекламного клика купили другой ваш товар; недобор показов — сколько показов по запросу получает лучший конкурент сверх вас (оценка MPSTATS).</p>
  <p><b>Обновление:</b> напишите Claude «обнови пульт» — соберёт свежие данные и обновит эту страницу. Новые сравнения из ЛК — архивы в «Загрузки», затем «обнови сравнения».</p></div>`;
  $("#hclose").onclick = () => o.hidden = true; o.onclick = e => { if (e.target === o) o.hidden = true; };
}

/* ---------- поиск и клавиши ---------- */
const qi = $("#q"), sg = $("#sugg"); let sgi = 0, sgl = [];
qi.oninput = () => {
  const t = qi.value.trim().toLowerCase(); if (!t) { sg.hidden = true; return; }
  sgl = (D.sku || []).filter(s => String(s.nm).includes(t) || s.vc.toLowerCase().includes(t) || (s.aroma || "").toLowerCase().includes(t) || s.title.toLowerCase().includes(t)).sort((a, b) => b.p30.orders - a.p30.orders).slice(0, 12);
  sgi = 0; sg.innerHTML = sgl.map((s, i) => `<div data-i="${i}" class="${i === 0 ? "on" : ""}"><span>${esc(s.vc)}</span><span class="meta mono">${s.nm} · ${N(s.p30.orders)} зак.</span></div>`).join("") || '<div class="meta">Не найдено</div>'; sg.hidden = false;
  sg.querySelectorAll("[data-i]").forEach(d => d.onmousedown = () => pick(+d.dataset.i));
};
function pick(i) { const s = sgl[i]; if (!s) return; sg.hidden = true; qi.value = ""; qi.blur(); go(st.tab === "rnp" ? "rnp" : "sku", s.nm); }
qi.onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sgi = Math.max(0, Math.min(sgl.length - 1, sgi + (e.key === "ArrowDown" ? 1 : -1))); sg.querySelectorAll("[data-i]").forEach((d, i) => d.classList.toggle("on", i === sgi)); }
  if (e.key === "Enter") pick(sgi); if (e.key === "Escape") { sg.hidden = true; qi.blur(); }
};
qi.onblur = () => setTimeout(() => sg.hidden = true, 150);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#help").hidden = true; return; }
  if (e.target.matches("input,textarea,select")) return; if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); qi.focus(); return; }
  if (e.key === "?") { help(); return; }
  const t = TABS.find(x => x[2].toLowerCase() === e.key.toLowerCase() || (e.code === "Key" + x[2] && /^[A-Z]$/.test(x[2]))); if (t) { go(t[0]); return; }
  if ((st.tab === "sku" || (st.tab === "rnp" && st.rsub !== "all")) && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { const i = D.order.indexOf(st.nm); const nx = D.order[i + (e.key === "ArrowRight" ? 1 : -1)]; if (nx) go(st.tab, nx); }
});
boot();
