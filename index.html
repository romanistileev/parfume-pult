<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт parfume de Paris</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: рабочий пульт — слева навигация по разделам, сверху поиск артикула; основная зона — плотные таблицы, графики и провалы внутрь */
:root {
  --bg: #F2F3F5; --panel: #FFFFFF; --fg: #171A1F; --muted: #5F6672; --line: #DDE0E5; --head: #ECEEF1; --hover: #F5F7F9;
  --accent: #0D6A65; --accent-soft: #DBEEEB; --me: #FFF4D6;
  --good: #20774A; --bad: #B4362E; --warn: #A3640F; --good-soft: #DFF1E6; --bad-soft: #F8E1DE; --warn-soft: #F7ECDA;
  --c1: #0D6A65; --c2: #C0662B; --c3: #5B5FC7; --c4: #8A8F98; --c5: #2E8B57;
  --ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101216; --panel: #181B20; --fg: #E5E7EA; --muted: #9AA1AB; --line: #2A2E36; --head: #1F232A; --hover: #20252C;
  --accent: #4DB6AE; --accent-soft: #15332F; --me: #2F2A1A;
  --good: #5CBB83; --bad: #EF7B70; --warn: #E1A64B; --good-soft: #17301F; --bad-soft: #3A201D; --warn-soft: #33281A;
  --c1: #4DB6AE; --c2: #E58C52; --c3: #8D90F0; --c4: #8A8F98; --c5: #6BCB8F; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101216; --panel: #181B20; --fg: #E5E7EA; --muted: #9AA1AB; --line: #2A2E36; --head: #1F232A; --hover: #20252C;
  --accent: #4DB6AE; --accent-soft: #15332F; --me: #2F2A1A;
  --good: #5CBB83; --bad: #EF7B70; --warn: #E1A64B; --good-soft: #17301F; --bad-soft: #3A201D; --warn-soft: #33281A;
  --c1: #4DB6AE; --c2: #E58C52; --c3: #8D90F0; --c4: #8A8F98; --c5: #6BCB8F; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.45 var(--ui); }
.app { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 3px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-weight: 700; font-size: 15px; padding: 2px 8px 10px; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
aside button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; color: var(--fg); }
aside button:hover { background: var(--hover); }
aside button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
aside .help { margin-top: auto; color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
main { padding-block: 14px 60px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; min-width: 0; }
.top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px; }
.search { position: relative; flex: 1 1 320px; max-width: 520px; }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; }
.sugg { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 360px; overflow: auto; z-index: 10; }
.sugg div { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.sugg div:hover, .sugg div.on { background: var(--accent-soft); }
.meta { color: var(--muted); font-size: 12px; }
h1 { font-size: 19px; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
h3 { font-size: 13px; margin: 0; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sp { justify-content: space-between; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.grid > *, .card > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.kpis { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: grid; gap: 1px; }
.kpi .v { font-family: var(--mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11.5px; color: var(--muted); }
.d { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
.up { color: var(--good); } .dn { color: var(--bad); } .wr { color: var(--warn); }
.tw { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: inherit; z-index: 1; }
thead th { position: sticky; top: 0; background: var(--head); color: var(--muted); font-weight: 600; font-size: 11.5px; cursor: pointer; z-index: 2; white-space: normal; vertical-align: bottom; min-width: 56px; user-select: none; }
thead th:first-child { z-index: 3; background: var(--head); }
thead th[data-s]::after { content: attr(data-s); margin-left: 3px; color: var(--accent); }
tbody tr { background: var(--panel); }
tbody tr:hover { background: var(--hover); }
tbody tr.click { cursor: pointer; }
tbody tr.sel td { background: var(--accent-soft); }
tr.me td { background: var(--me); font-weight: 600; }
td.l, th.l { text-align: left; }
td.wrap { white-space: normal; min-width: 220px; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.p-high, .p-bad { background: var(--bad-soft); color: var(--bad); } .p-mid, .p-warn { background: var(--warn-soft); color: var(--warn); } .p-low, .p-mute { background: var(--head); color: var(--muted); }
.p-A, .p-good { background: var(--good-soft); color: var(--good); } .p-B, .p-acc { background: var(--accent-soft); color: var(--accent); } .p-C { background: var(--head); color: var(--muted); }
.btn { all: unset; cursor: pointer; padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 12.5px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--panel); }
select, .inp { padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--fg); font: inherit; max-width: 100%; }
.inp.n { width: 92px; font-family: var(--mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 10px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.chart { position: relative; height: 230px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 170px 1fr 84px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .t { height: 12px; background: var(--head); border-radius: 3px; position: relative; overflow: hidden; }
.bar .t i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.stack { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--head); }
.stack i { display: block; height: 100%; min-width: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--sw); vertical-align: -1px; }
.rec { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rec:last-child { border-bottom: 0; }
.rec .ev { color: var(--muted); font-size: 12.5px; grid-column: 2; }
.rec .act { grid-column: 2; font-size: 12.5px; }
.lnk { color: var(--accent); cursor: pointer; text-decoration: none; }
.lnk:hover { text-decoration: underline; }
.note { font-size: 12px; color: var(--muted); max-width: 110ch; }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; }
.callout.w { border-color: var(--warn); background: var(--warn-soft); }
.callout.b { border-color: var(--bad); background: var(--bad-soft); }
textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; background: var(--panel); color: var(--fg); }
.ask { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.mono { font-family: var(--mono); }
.wf { display: grid; gap: 4px; }
.wf .bar { grid-template-columns: 190px 1fr 140px; }
.sim { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.sim label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.ov { position: fixed; inset: 0; background: color-mix(in srgb, var(--fg) 35%, transparent); z-index: 40; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov .card { max-width: 820px; max-height: 86vh; overflow: auto; }
.rnp table td, .rnp table th { min-width: 64px; }
.pbar { gap: 8px; } .pbar select, .pbar .inp { padding: 4px 8px; font-size: 12.5px; } .pbar input[type=date] { width: 138px; }
.notes { display: grid; gap: 8px; } .slog { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; } ol.plan { margin: 0; padding-left: 20px; display: grid; gap: 6px; } .note-i { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; } .note-i .meta { margin-bottom: 2px; }
.rnp tr.sec td { background: var(--head); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-top: 9px; }
tr.bold td { font-weight: 600; }
td.tot, th.tot { background: var(--head); font-weight: 600; }
td.we, th.we { background: color-mix(in srgb, var(--head) 55%, var(--panel)); }
td.cu1, .hm.cu1 { background: var(--good-soft); } td.cu2, .hm.cu2 { background: color-mix(in srgb, var(--good) 32%, var(--panel)); }
td.cd1, .hm.cd1 { background: var(--bad-soft); } td.cd2, .hm.cd2 { background: color-mix(in srgb, var(--bad) 32%, var(--panel)); }
.hm { margin: -5px -9px; padding: 5px 9px; }
.hm.p1, .pp1 { background: var(--good-soft); color: var(--good); font-weight: 600; } .hm.p2, .pp2 { background: color-mix(in srgb, var(--good-soft) 45%, var(--panel)); }
.hm.p4, .pp4 { background: var(--warn-soft); color: var(--warn); } .hm.p0 { color: var(--muted); } .pp3 { background: var(--head); }
sup { font-size: 9px; color: var(--c3); margin-left: 1px; }
.pop { position: fixed; z-index: 60; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; box-shadow: 0 10px 28px rgba(0,0,0,.2); font-size: 12.5px; line-height: 1.45; max-height: min(74vh, 640px); overflow: auto; }
.pop h4 { margin: 0 0 3px; font-size: 13.5px; }
.pop .pl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 14px; margin-top: 7px; }
.pop .pl > span:nth-child(odd) { color: var(--muted); }
.pop .pl > span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.pop .sec { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
.pop .sec > b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.pop .why { margin-top: 9px; padding: 7px 9px; background: var(--accent-soft); border-radius: 7px; }
[data-pop] { cursor: help; } tr[data-pop] { cursor: pointer; } .kpi[data-pop]:hover, .callout[data-pop]:hover { outline: 1px solid var(--accent); }
/* РНП: окно дня — сводка сверху, ниже по артикулам: артикул зелёным, кампании с цветной меткой места, ключи серым */
.pop h4 .meta { font-weight: 400; }
.pop .rw-s { margin-top: 6px; padding: 7px 10px; background: var(--accent-soft); border-radius: 7px; }
.pop .rw-s p { margin: 0; } .pop .rw-s p + p { margin-top: 3px; }
.pop .rw-n { color: var(--accent); font-weight: 600; }
.pop .rw-a { margin-top: 9px; padding: 1px 0 1px 10px; border-left: 3px solid var(--accent); }
.pop .rw-a.one { border-left-color: var(--line); }
.pop .rw-a .h .lnk { font-weight: 650; }
.pop .rw-a .h .w { color: var(--fg); }
.pop .rw-c, .pop .rw-k { margin-top: 3px; }
.pop .rw-c .cn { font-weight: 500; }
.pop .rw-k { color: var(--muted); }
.pop .ty { display: inline-block; min-width: 46px; text-align: center; font-size: 10.5px; font-weight: 600; line-height: 16px; padding: 0 5px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.pop .ty.s { color: var(--c3); background: color-mix(in srgb, var(--c3) 15%, transparent); }
.pop .ty.p { color: var(--c2); background: color-mix(in srgb, var(--c2) 15%, transparent); }
.pop .ty.u { color: var(--c5); background: color-mix(in srgb, var(--c5) 16%, transparent); }
.pop .ty.k { color: var(--muted); background: var(--head); }
.pop .wr { color: var(--warn); }
.pop .rw-x { display: none; } .pop .rw.all .rw-x { display: block; }
.pop .rwmore { display: inline-block; margin-top: 8px; }
/* /РНП окно дня */
.fxs { display: grid; gap: 1px; }
.fx, .cx { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(70px, 1fr) 60px; gap: 10px; align-items: center; padding: 5px 7px; border-radius: 6px; font-size: 12.5px; }
.cx { grid-template-columns: minmax(0, 1fr) auto 52px; }
.fx:hover, .cx:hover { background: var(--hover); }
.fx .d, .cx .d { text-align: right; font-size: 12.5px; }
.fx .t { height: 10px; position: relative; background: var(--head); border-radius: 3px; }
.fx .t i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.fx .t::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .45; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--head); color: var(--muted); white-space: nowrap; }
.chip.ads { background: color-mix(in srgb, var(--c3) 16%, var(--panel)); color: var(--c3); } .chip.org { background: var(--accent-soft); color: var(--accent); }
.chip.cr { background: var(--warn-soft); color: var(--warn); } .chip.st { background: var(--bad-soft); color: var(--bad); }
.ai { font-size: 13.5px; line-height: 1.55; max-width: 120ch; }
details summary { cursor: pointer; }
/* «Сегодня» v4: плитки, график, «Почему», «Что сделать сейчас», таблица; подробности — в подсказке при наведении */
.tpk { cursor: help; }
.kpi.tpk:hover, .kpi.tp-on { outline: 1px solid var(--accent); }
.tdgrid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.tdw { gap: 9px; }
.tdv { font-size: 15px; font-weight: 600; }
.tdv.dn { color: var(--bad); } .tdv.up { color: var(--good); }
.tdv .meta { font-weight: 400; font-size: 12.5px; }
.tdr2 { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; align-items: baseline; font-size: 13px; }
.tdr2 > .k { color: var(--muted); font-size: 12px; }
.tdi { display: flex; flex-wrap: wrap; gap: 3px 14px; min-width: 0; }
.tdi.tdcol { display: grid; gap: 3px; }
.tdi:not(.all) .tdx { display: none; }
.tdmore { font-size: 12.5px; white-space: nowrap; }
/* причины: название · сколько заказов дала · что за ней стоит (было → стало) */
.tdcs { display: grid; gap: 2px; min-width: 0; }
.tdcs > .k { color: var(--muted); font-size: 12px; margin-bottom: 1px; }
.tdc { display: grid; grid-template-columns: 154px 90px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 1px 4px; margin: 0 -4px; font-size: 13px; }
.tdc .d { font-weight: 650; white-space: nowrap; }
.tdc .m { color: var(--muted); font-size: 12.5px; }
.tdc .m b { color: var(--fg); font-weight: 600; }
.tdest { margin-top: 3px; font-size: 12px; }
.tdit { cursor: pointer; border-radius: 4px; }
.tdit:hover, .tdit.tp-on { color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.tdtodo { display: grid; gap: 0; }
/* «Что сделать сейчас»: слева артикул, справа — строки про него */
.tdg { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 0 12px; align-items: start; padding: 4px 0; border-top: 1px solid var(--line); }
.tdg:first-child { border-top: 0; }
.tdg-a { padding: 6px 0 6px 8px; font-weight: 600; font-size: 13px; min-width: 0; }
.tdg-r { display: grid; gap: 0; min-width: 0; }
.tdt2 { display: grid; grid-template-columns: 10px minmax(170px, 1.3fr) minmax(84px, auto) minmax(0, 1.5fr) auto; gap: 2px 10px; align-items: baseline;
  padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.tdt2 .cmp { font-weight: 400; color: var(--muted); }
.tdt2:hover, .tdt2.tp-on { background: var(--hover); }
.tdt2 .dot { align-self: start; margin-top: 5px; }
.tdt2 .lab { font-weight: 600; }
.tdt2 .obj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tdt2 .num { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.tdt2 .sub { color: var(--muted); font-size: 12px; }
.tdt2 .sub.wide { grid-column: 3 / -1; color: var(--fg); font-size: 13px; }
.tdt2 .go { white-space: nowrap; font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); display: inline-block; }
.dot.bad { background: var(--bad); }
td.tdwhy { max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
tbody tr[data-tp] { cursor: pointer; }
tbody tr.tp-on td { background: var(--accent-soft); }
.tpop { position: fixed; z-index: 60; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px 11px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .18); font-size: 12.5px; line-height: 1.45; max-height: min(72vh, 600px); overflow: auto; }
.tpop.pin { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tpop .tp-h { font-weight: 650; font-size: 13.5px; padding-right: 20px; }
.tpop .tp-n { font-weight: 400; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tpop .tp-n b { color: var(--fg); }
.tpop .tp-s { color: var(--muted); font-size: 11.5px; margin: 1px 0 6px; }
.tpop .tp-m { margin: 3px 0; }
.tpop .tp-m.dn b { color: var(--bad); } .tpop .tp-m.up b { color: var(--good); }

function simCalc() {
  const v = id => +($("#" + id)?.value || 0); const s = D.byNm[st.simnm], p = s.pnl30;
  const price = v("s_price"), spp = v("s_spp") / 100, k = v("s_k") / 100, bp = price * (1 - spp);
  const pay = price * (1 - k), ind = price * v("s_ind") / 100, tax = bp * v("s_tax") / 100 + bp * v("s_nds") / (100 + v("s_nds"));
  const net = pay - v("s_log") - v("s_cost") - v("s_ads") - v("s_pen") - ind - tax;
  const bp0 = p.rev1 || bp; const dq = -(bp / bp0 - 1) * 100 * v("s_el"); const qty = v("s_qty") * (1 + dq / 100);
  const net0 = p.net1, qty0 = v("s_qty");
  $("#simOut").innerHTML = `<h2>Результат</h2><div class="kpis">
    <div class="kpi"><span class="l">Цена покупателя</span><span class="v">${N(bp)} ₽</span>${dlt(P(bp, bp0))}</div>
    <div class="kpi"><span class="l">К перечислению</span><span class="v">${N(pay)} ₽</span></div>
    <div class="kpi"><span class="l">Прибыль на шт</span><span class="v ${net < 0 ? "dn" : ""}">${N(net)} ₽</span><span class="meta">факт: ${N(net0)} ₽</span></div>
    <div class="kpi"><span class="l">Продаж в месяц</span><span class="v">${N(qty)}</span>${dlt(dq)}</div>
    <div class="kpi"><span class="l">Прибыль в месяц</span><span class="v ${net < 0 ? "dn" : ""}">${N(net * qty)} ₽</span><span class="meta">сейчас ≈ ${N(net0 * qty0)} ₽</span></div>
    <div class="kpi"><span class="l">Изменение прибыли</span><span class="v">${dlt(net * qty - net0 * qty0, false, " ₽")}</span></div></div>`;
}

    : k === "st" ? "закончился товар" : k === "oc" ? `${up ? "больше" : "меньше"} заходов без рекламы или ${up ? "чаще" : "реже"} покупают` : FN2[k].toLowerCase(); };
/* что стоит за причиной: было → стало. W — {G: органические переходы, A: клики рекламы, rk, rz: конверсия в корзину и из корзины в заказ, fc: вклад этапов, lag}.
   Цифру показываем, только если она идёт в ту же сторону, что и вклад, — иначе запутает (сумма по артикулам бывает с другим знаком, чем итог кабинета). */
function causeWhat(k, W, v) {

      .sort((a, b) => Math.abs(W.fc?.[b[0]] || 0) - Math.abs(W.fc?.[a[0]] || 0)).map(([, l, r]) => `${l} ${ba(r1(r[1]), r1(r[0]), "%", 1)}`).join(" · ");
  }

let TD = null;

/* сводка дня: из неё — блок «Почему», подсказка у плитки «Заказы» и строки под графиком */
function tdSum() {

  const lim = Math.max(2, (Wy.ob || 0) * 0.01);  // мелочь (меньше 1% заказов базы) в причины не выносим
  // нет снимка аналитики базового дня совсем (оценка по всему дню) — трафик и конверсию не делим: утром такая оценка сильно врёт
  const f = { ...Wy.f }; if (Wy.est?.fun === true) { f.oc = (f.org || 0) + (f.cr || 0); delete f.org; delete f.cr; }
  const ks = FKS.filter(k => Math.abs(f[k] || 0) >= lim).concat(Math.abs(f.oth || 0) >= Math.max(3, lim) ? ["oth"] : []).sort((a, b) => Math.abs(f[b]) - Math.abs(f[a]));
  const rows = X.nm.map(r => [r, W_(r)]).filter(([, w]) => w);
  const down = rows.filter(([, w]) => w.d <= -3).sort((a, b) => a[1].d - b[1].d), up = rows.filter(([, w]) => w.d >= 3).sort((a, b) => b[1].d - a[1].d);
  const seen = new Set(), acts = [];
  (Wy.acts || []).forEach(a => { if (!seen.has(a.k)) { seen.add(a.k); acts.push(a); } });
  (X.alerts || []).forEach(a => { const k = a.id ? "c:" + a.id : a.nm ? "n:" + a.nm : null; if (k && !seen.has(k)) { seen.add(k); acts.push({ ...a, sev: a.k === "bad" ? "bad" : "warn", k, go: a.id ? "ads" : "sku" }); } });
  const main = flat ? null : ks.filter(k => k !== "oth" && f[k] * d > 0)[0] || null;  // главная причина — самая большая в сторону итога

}
const nmChip = ([r, w], cls = "") => `<span class="tdit${cls ? " " + cls : ""}" data-tp="n:${r.nm}">${esc(r.vc)} ${sgnD(w.d)}</span>`;
let tdctOff = () => {};  // спрятать подсказку графика (её задаёт график при отрисовке)

VIEWS.today = () => {

  const tryPw = async pw => { if (!pw) return null; try { const k = await deriveKey(pw, E); await decBytes(k, b64u8(E.check)); return k; } catch (e) { return null; } };
  let pw = null; try { pw = localStorage.getItem("pult_pw"); } catch (e) {}
  KEY = (await tryPw(pw)) || await askPw(tryPw);
  if (E.notes?.tok) { try { GN.tok = new TextDecoder().decode(await decBytes(KEY, b64u8(E.notes.tok))); GN.repo = E.notes.repo; } catch (e) {} }
  load();
}

  const ds = D.meta.dates, gr = st.cgr || "d", from = ds[Math.max(0, ds.length - (+st.cper || 60))], X = base(D.order);
  const sm = (k, b) => b.ix.reduce((a, i) => a + (X[k][i] || 0), 0);

  const opens = B.map(b => sm("opens", b)), clk = B.map(b => sm("ad_clicks", b)), org = opens.map((v, i) => Math.max(0, v - clk[i]));

    { l: "Показы рекламы (правая ось)", d: B.map(b => sm("ad_views", b)), c: "--c3", y: "y2" }], { stacked: true, h: 300 });
  const IT = [["wbk", "Комиссия WB", "--c3"], ["logi", "Логистика", "--c4"], ["cogs", "Себестоимость", "--c2"], ["taxi", "Налоги и косвенные", "--warn"], ["ad_sum", "Реклама", "--bad"], ["prof", "Прибыль", "--c5"]];
  const rev = B.map(b => sm("rev_e", b)), pc = st.cun !== "rub", tR = tot("rev_e");
  const un = line("chUn", lab, IT.map(([k, l, c]) => ({ l, d: B.map((b, i) => rev[i] ? (pc ? sm(k, b) / rev[i] * 100 : sm(k, b)) : null), c, t: "bar", stack: "a" })), { stacked: true, h: 320 });

  <div class="card"><h2>Трафик: органический и рекламный</h2>
    <div class="kpis">${kpi("Переходы в карточку", N(tO))}${kpi("Органические", N(tO - tC), sh(tO - tC, tO) + " переходов")}${kpi("Рекламные клики", N(tC), sh(tC, tO) + " переходов")}${kpi("Показы рекламы", N(tV), "CTR " + sh(tC, tV))}</div>
    ${tr}<p class="meta">Органические переходы = все переходы в карточку минус клики рекламы. Показы WB отдаёт только по рекламе: органических показов в его данных нет.</p></div>
  <div class="card"><div class="row sp"><h2>Юнитка по статьям: на что уходит выручка</h2>${seg("cun", [["pct", "% выручки"], ["rub", "₽"]])}</div>
    <div class="kpis">${IT.map(([k, l]) => kpi(l, sh(tot(k), tR), N(tot(k)) + " ₽")).join("")}</div>
    ${un}<p class="meta">Оценка по модели юнитки: выручка = сумма заказов × процент выкупа. Комиссия, логистика и себестоимость берутся по параметрам артикула, реклама по факту.</p></div>`;

/* ---------- МЕТКИ ИЗМЕНЕНИЙ на графике артикула: цена, СПП, ставка рекламы, реклама включена или выключена ---------- */
const MKP = marks => ({ id: "mk", afterDatasetsDraw(ch) {
  const { ctx, chartArea: a, scales: { x } } = ch; ctx.save(); ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
  marks.forEach(m => { const px = x.getPixelForValue(m.i); if (px < a.left || px > a.right) return; ctx.strokeStyle = ctx.fillStyle = css(m.c);
    ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.beginPath(); ctx.moveTo(px - 4, a.top); ctx.lineTo(px + 4, a.top); ctx.lineTo(px, a.top + 6); ctx.fill(); });
  ctx.restore(); } });
function skuEvents(nm) {
  const S = D.series?.[nm] || {}, n = D.meta.dates.length, ev = [], f = v => (v > 0 ? "+" : "−") + N(Math.abs(v), Math.abs(v) < 10 ? 1 : 0);
  const kn = (a, i, d) => { for (let j = i + d; j >= 0 && j < n; j += d) if (a[j]) return j; return -1; };
  // сдвиг уровня: к прошлому известному дню или, если изменение пришлось на середину дня, к позапрошлому; следующий день должен его подтвердить

    for (let i = 1; i < n; i++) { const b = arr[i]; if (!b) continue; const k1 = kn(arr, i, -1); if (k1 < 0) continue; const k2 = kn(arr, k1, -1), kx = kn(arr, i, 1);
      if (kx >= 0 && df(arr[kx], b) >= conf) continue;
      let a = null; if (df(b, arr[k1]) >= thr) a = arr[k1]; else if (k2 >= 0 && df(b, arr[k2]) >= thr && last !== k1) a = arr[k2];
      if (a != null) { out.push({ i, a, b }); last = i; } }
    return out; };
  const as = S.ad_sum || [], av = S.ad_views || [], cpm = as.map((v, i) => av[i] >= 2000 ? v / av[i] * 1000 : null);
  det(S.price || [], true, 0.03, 0.015).forEach(e => ev.push({ i: e.i, c: "--c2", t: `Цена продавца ${N(e.a)} → ${N(e.b)} ₽ (${f((e.b / e.a - 1) * 100)}%)` }));
  det(S.spp || [], false, 3, 1.5).forEach(e => ev.push({ i: e.i, c: "--c3", t: `СПП ${N(e.a, 1)} → ${N(e.b, 1)}% (${f(e.b - e.a)} п.п.)` }));
  det(cpm, true, 0.15, 0.07).forEach(e => ev.push({ i: e.i, c: "--c1", t: `Ставка рекламы ${N(e.a)} → ${N(e.b)} ₽ за 1000 показов (${f((e.b / e.a - 1) * 100)}%)` }));
  for (let i = 1; i < n; i++) { const y = as[i - 1] || 0, x = as[i] || 0, z = i + 1 < n ? (as[i + 1] || 0) : x;
    if (y >= 300 && x < 30 && z < 30) ev.push({ i, c: "--bad", t: `Реклама выключена (было ${N(y)} ₽ в день)` });
    if (y < 30 && x >= 300 && z >= 300) ev.push({ i, c: "--good", t: `Реклама включена (${N(x)} ₽ в день)` }); }
  return ev.filter(e => e.i >= n - 45).sort((p, q) => p.i - q.i);   // только последние 45 дней: раньше меток слишком много

function evList(ev) {
  if (!ev.length) return `<p class="meta">За 45 дней заметных изменений цены, СПП и рекламы не было.</p>`;
  const li = e => `<div class="evi"><span class="mono">${fmtD(D.meta.dates[e.i])}</span><i style="background:var(${e.c})"></i><span>${e.t}</span></div>`, r = ev.slice().reverse();
  return `<div class="evl">${r.slice(0, 5).map(li).join("")}${r.length > 5 ? `<details><summary class="meta">ещё ${r.length - 5}</summary>${r.slice(5).map(li).join("")}</details>` : ""}</div>`;
}
/* ---------- МЕНЮ по разделам ---------- */
const NAVO = ["today", "plan", "rnp", "overview", "sku", "unit", "charts", "ads", "traffic", "search", "recs", "comp", "novel", "aud", "glue", "wh", "cmp"];
const NAVH = { today: "Каждый день", sku: "Разбор", comp: "Рынок", glue: "Справочно" }; const NAVX = new Set(["Справочно"]);   // свёрнутые разделы меню
TABS.sort((a, b) => NAVO.indexOf(a[0]) - NAVO.indexOf(b[0]));

/* ---------- ЮНИТКА как в таблице менеджеров: по склейкам, по артикулам, по неделям ---------- */
const UCOL = [["price", "Цена", 0], ["spp", "СПП", "p"], ["bp", "Цена покуп.", 0], ["wb", "Удержания WB", 0], ["log", "Логистика", 0], ["ads1", "Реклама на шт", 0], ["drr", "ДРР", "p"], ["inc", "Доход", 0], ["cogs", "Себес", 0], ["mar", "Маржа", 0],
  ["ind", "Косвенные", 0], ["tax", "Налоги", 0], ["net1", "Чистая на шт", "n"], ["dnet", "Δ к пред. неделе", "d"], ["rent", "Рент.", "p"], ["qty", "Продажи, шт", 0], ["net", "Чистая прибыль", "n"], ["turn", "Оборот", 0]];
function uAgg(ps) {   // строки отчёта по артикулам за период; значения на штуку — средневзвешенно по продажам
  let q = 0, net = 0, nocost = false; const S = { price: 0, rev1: 0, wbp: 0, log1: 0, ads1: 0, cogs1: 0, ind1: 0, tax1: 0 };
  ps.forEach(p => { if (!p || !p.qty) return; q += p.qty; for (const k in S) S[k] += (p[k] || 0) * p.qty; net += p.net || 0; if (p.nocost) nocost = true; });
  if (!q) return null; for (const k in S) S[k] /= q; const inc = S.price - S.wbp - S.log1 - S.ads1;
  return { qty: q, net, nocost, price: S.price, spp: S.price ? (1 - S.rev1 / S.price) * 100 : null, bp: S.rev1, wb: S.wbp, log: S.log1, ads1: S.ads1, drr: S.price ? S.ads1 / S.price * 100 : null,
    inc, cogs: S.cogs1, mar: inc - S.cogs1, ind: S.ind1, tax: S.tax1, net1: net / q, rent: S.price ? net / q / S.price * 100 : null, turn: S.price * q };
}
const uVal = (r, k, prev) => k === "dnet" ? (r && prev ? r.net1 - prev.net1 : null) : r?.[k];
function uCell(r, [k, , f], prev) {
  const v = uVal(r, k, prev); if (v == null || isNaN(v)) return `<td>—</td>`;
  return `<td>${f === "p" ? N(v, 1) + "%" : f === "d" ? dlt(v, false, " ₽") : f === "n" ? netCls(Math.round(v)) : N(v)}</td>`;
}
UNIT.funnel = UNIT.table;
UNIT.table = () => {
  const WK = D.total?.pnlw || [], uw = String(st.uw ?? ""), w = uw === "30" || WK.some(x => x.w === uw) ? uw : (WK.at(-1)?.w || "30");
  const wi = WK.findIndex(x => x.w === w), pw = wi > 0 ? WK[wi - 1].w : null, P = (s, k) => k === "30" ? s.pnl30 : s.pnlw?.[k];
  const mode = st.ugr || (st.ugr = "glue"), open = st.uopen || (st.uopen = {}), wl = x => `${fmtD(x.w)}–${fmtD(x.to)}`;
  const row = (label, cur, prev, cls, attr) => `<tr class="${cls || ""}" ${attr || ""}><td>${label}</td>${UCOL.map(c => uCell(cur, c, prev)).join("")}</tr>`;
  const skuRow = (s, sub) => { const c = uAgg([P(s, w)]); if (!c) return null;
    return { c, h: row(`<a class="lnk" data-go="${s.nm}">${esc(s.vc)}</a>${c.nocost ? ' <span class="meta">нет себес.</span>' : ""}`, c, pw ? uAgg([P(s, pw)]) : null, sub ? "sub" : "") }; };
  let body = "";
  if (mode === "glue") {
    const G = {}; D.sku.forEach(s => (G[s.glue || 0] = G[s.glue || 0] || []).push(s));
    Object.entries(G).map(([id, list]) => ({ id, list, c: uAgg(list.map(s => P(s, w))), p: pw ? uAgg(list.map(s => P(s, pw))) : null })).filter(g => g.c).sort((a, b) => b.c.net - a.c.net).forEach(g => {
      const lead = g.list.slice().sort((a, b) => (P(b, w)?.qty || 0) - (P(a, w)?.qty || 0))[0];
      body += row(`<b>${open[g.id] ? "▾" : "▸"} ${g.id === "0" ? "Без склейки" : "Склейка №" + g.id + " · " + esc(lead.vc)}</b> <span class="meta">${g.list.length} арт.</span>`, g.c, g.p, "grp", `data-ug="${g.id}"`);
      if (open[g.id]) body += g.list.map(s => skuRow(s, true)).filter(Boolean).sort((a, b) => b.c.qty - a.c.qty).map(x => x.h).join(""); });
  } else body = D.sku.map(s => skuRow(s)).filter(Boolean).sort((a, b) => b.c.net - a.c.net).map(x => x.h).join("");
  const tot = uAgg(D.sku.map(s => P(s, w))), totP = pw ? uAgg(D.sku.map(s => P(s, pw))) : null;
  const head = first => `<thead><tr><th>${first}</th>${UCOL.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead>`;
  TBL.unitx = { cols: [["vc", "Артикул"], ["nm", "Артикул WB"], ["glue", "Склейка"], ...UCOL.map(c => [c[0], c[1]])],
    rows: D.sku.map(s => { const c = uAgg([P(s, w)]); if (!c) return null; const p = pw ? uAgg([P(s, pw)]) : null, r = { vc: s.vc, nm: s.nm, glue: s.glue || "" }; UCOL.forEach(([k]) => { const v = uVal(c, k, p); r[k] = v == null || isNaN(v) ? "" : Math.round(v * 100) / 100; }); return r; }).filter(Boolean) };
  const weeks = WK.slice().reverse().map((x, i, a) => row(wl(x), uAgg(D.sku.map(s => P(s, x.w))), a[i + 1] ? uAgg(D.sku.map(s => P(s, a[i + 1].w))) : null, x.w === w ? "sel" : "")).join("");
  return `<div class="card"><div class="row sp"><div class="row">${seg("ugr", [["glue", "По склейкам"], ["nm", "По артикулам"]])}
      <label class="meta">Период <select data-st="uw"><option value="30" ${w === "30" ? "selected" : ""}>30 дней отчётов</option>${WK.slice().reverse().map(x => `<option value="${x.w}" ${w === x.w ? "selected" : ""}>неделя ${wl(x)}</option>`).join("")}</select></label>
      ${mode === "glue" ? `<a class="lnk" data-uall="1">развернуть все</a><a class="lnk" data-uall="0">свернуть</a>` : ""}</div><button class="btn" data-csv="unitx">CSV</button></div>
    <p class="meta">Факт по отчётам реализации WB, ${esc(grpLabel())}. Доход = цена − удержания WB (комиссия, эквайринг, прочее) − логистика − реклама. Маржа = доход − себестоимость. Рентабельность = чистая на шт / цена продавца, как в таблице менеджеров.${mode === "glue" ? " Нажмите на склейку, чтобы увидеть её артикулы." : ""}</p>
    <div class="tw" style="max-height:640px"><table class="ux">${head(mode === "glue" ? "Склейка / артикул" : "Артикул")}<tbody>${row(`<b>Итого</b>`, tot, totP, "tot")}${body || `<tr><td colspan="${UCOL.length + 1}" class="meta">за этот период продаж нет</td></tr>`}</tbody></table></div></div>
  <div class="card"><h2>По неделям <span class="meta">${esc(grpLabel())} · одну склейку или тег выберите в «Группе» вверху</span></h2>
    <div class="tw" style="max-height:520px"><table class="ux">${head("Неделя отчёта")}<tbody>${weeks}</tbody></table></div></div>`;
};
document.addEventListener("click", e => {
  const tr = e.target.closest?.("tr[data-ug]"); if (tr && !e.target.closest("a")) { const o = st.uopen || (st.uopen = {}); o[tr.dataset.ug] = !o[tr.dataset.ug]; render(); return; }
  const a = e.target.closest?.("[data-uall]"); if (a) { st.uopen = {}; if (a.dataset.uall === "1") D.sku.forEach(s => st.uopen[s.glue || 0] = true); render(); }
});
/* GRP:END */

/* ---------- СПРАВКА ---------- */
function help() {
  const o = $("#help"); o.hidden = false;
  o.innerHTML = `<div class="card"><div class="row sp"><h2>Справка</h2><button class="btn" id="hclose">Закрыть (Esc)</button></div>
  <p><b>Клавиши:</b> <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> — разделы, <kbd>D</kbd> — РНП по дням, <kbd>N</kbd> — новинки и пары, <kbd>A</kbd> — аудитория и инфографика, <kbd>R</kbd> — рекомендации, <kbd>/</kbd> — поиск артикула, <kbd>←</kbd> <kbd>→</kbd> — соседний артикул (Артикул, РНП, Трафик, Конкуренты), <kbd>?</kbd> — справка. <b>Панель сверху:</b> «Смотрим» — весь кабинет, бренд, свой тег или склейка; все разделы считаются по этой области. Рядом — текущий артикул: нажмите, чтобы выбрать из области, или наберите, чтобы найти в кабинете (чужой артикул переключит область на его склейку). Клик по заголовку колонки — сортировка, по строке — провал внутрь, «CSV» — выгрузка таблицы.</p>
  <p><b>Период:</b> вверху страницы — «Вчера», «Последние 2 дня», 7, 14, 30, 90 дней, прошлая неделя, этот или прошлый месяц, или свои даты. Обзор, РНП, Юнитка (воронка и реклама), Артикул, Реклама и Склейки считаются за этот период и сравниваются с предыдущим периодом такой же длины — или с теми же днями недели раньше (удобно для «вчера к прошлому вторнику»). Если сравниваемый период короче (не хватает истории), изменение считается в среднем за день. Разделы с данными MPSTATS и поиска WB работают за свои фиксированные окна — это подписано в разделе.</p>
  <p><b>Для команды:</b> данные обновляет владелец — фразой «обнови пульт» в Claude; дата обновления — слева вверху. Заметки по артикулу (внизу страницы артикула) и отметки складов видны всем и подписаны автором; добавлять их могут люди с правом редактирования, остальные только смотрят. Пульт открывается по ссылке как обычный сайт; общие заметки видны тем, кто вошёл в Claude, а писать их могут владелец и редакторы — остальные ведут личные заметки (хранятся в их браузере). Выбранный период и вкладка запоминаются у каждого свои.</p>
  <p><b>РНП:</b> воронка, цена, реклама, поиск и прибыль по каждому артикулу по дням; переключатели «Дни / Недели / Месяцы» сворачивают те же цифры, «В день» делает неполные периоды сравнимыми. Цвет клетки — лучше или хуже предыдущего периода (с учётом смысла: рост ДРР — плохо). Прибыль по дням — оценка по заказам дня с фактическим выкупом, удержаниями и логистикой артикула за 5 недель; в неделях и месяцах рядом — факт отчёта реализации. Вкладки РНП: «Все артикулы» (любой показатель по всем карточкам), «Реклама» (кампании, их артикулы и кластеры по дням), «Ключи и позиции» (позиция по каждому запросу по дням, вы и конкуренты).</p>
  <p><b>Новинки и пары:</b> спрос — запросы ниши «Духи» за 30 дней (MPSTATS) с прошлым месяцем для динамики; рынок — карточки аналогов до 1 500 ₽; пары — заказы из одной корзины WB за 120 дней и составы наборов у конкурентов.</p>
  <p><b>Модель прибыли:</b> ${esc(D.meta?.model?.note || "")}</p>
  <p><b>Источники:</b> WB API — воронка по дням (агрегаты), поисковые запросы и итоги поиска, статистика кампаний и поисковых кластеров, лента заказов, отчёт реализации, тарифы. MPSTATS — рынок по ароматам, позиции по ключам (органика/реклама) свои и конкурентов, продажи конкурентов, отзывы. Файлы — себестоимость, склейки, «Сравнение карточек», таблица «Аналитика продаж».</p>
  <p><b>Термины:</b> переходы — открытия карточки; CR корз. — корзины/переходы; CR заказ — заказы/корзины; CPO — расход/заказы; ДРР — расход/сумма заказов; полки — реклама в рекомендациях; ассоц. заказы — после рекламного клика купили другой ваш товар; недобор показов — сколько показов по запросу получает лучший конкурент сверх вас (оценка MPSTATS).</p>
  <p><b>Обновление:</b> напишите Claude «обнови пульт» — соберёт свежие данные и обновит эту страницу. Новые сравнения из ЛК — архивы в «Загрузки», затем «обнови сравнения».</p></div>`;
  $("#hclose").onclick = () => o.hidden = true; o.onclick = e => { if (e.target === o) o.hidden = true; };
}

/* ---------- поиск и клавиши ---------- */
const qi = $("#q"), sg = $("#sugg"); let sgi = 0, sgl = [];
qi.oninput = () => {
  const t = qi.value.trim().toLowerCase();   // пустой запрос — весь список артикулов
  const inA = new Set(D.order || []);   // область: при пустом запросе — только она, при наборе — весь кабинет, чужие помечены
  sgl = (t ? (D.skuAll || D.sku || []) : (D.sku || [])).filter(s => !t || String(s.nm).includes(t) || s.vc.toLowerCase().includes(t) || (s.aroma || "").toLowerCase().includes(t) || s.title.toLowerCase().includes(t)).sort((a, b) => b.p30.orders - a.p30.orders).slice(0, t ? 40 : 999);
  sgi = Math.max(0, sgl.findIndex(s => s.nm === st.nm));
  sg.innerHTML = sgl.map((s, i) => `<div data-i="${i}" class="${i === sgi ? "on" : ""}${inA.has(s.nm) || !grpOn() ? "" : " out"}"><span>${esc(s.vc)}</span><span class="meta mono">${inA.has(s.nm) || !grpOn() ? "" : "вне области · "}${s.nm} · ${N(s.p30.orders)} зак.</span></div>`).join("") || '<div class="meta">Не найдено</div>'; sg.hidden = false;
  const on = sg.querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest" });
  sg.querySelectorAll("[data-i]").forEach(d => d.onmousedown = () => pick(+d.dataset.i));
};
function pick(i) { const s = sgl[i]; if (!s) return; sg.hidden = true; qi.blur();
  if (grpOn() && !D.order.includes(s.nm)) {   // артикул вне области — область переключается на его склейку, чтобы панель не спорила сама с собой
    const g = (D.glue || []).find(x => x.cards.includes(s.nm)); st.grp = g ? "g:" + (g.imt || g.id) : ""; applyGroup(); toast("Смотрим: " + grpLabel());
  }
  st.scope = "nm"; const t = st.tab;   // разделы, которые умеют показывать выбранный артикул, остаются открытыми
  if (t === "traffic") { st.taroma = s.aroma; st.gapnm = s.nm; } else if (t === "comp") st.aroma = s.aroma; else if (t === "unit" && st.usub === "sim") st.simnm = s.nm;
  go(["sku", "rnp", "traffic", "comp"].includes(t) || (t === "unit" && st.usub === "sim") ? t : "sku", s.nm); }
qi.onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sgi = Math.max(0, Math.min(sgl.length - 1, sgi + (e.key === "ArrowDown" ? 1 : -1))); sg.querySelectorAll("[data-i]").forEach((d, i) => d.classList.toggle("on", i === sgi)); }
  if (e.key === "Enter") pick(sgi); if (e.key === "Escape") { sg.hidden = true; qi.blur(); }
};
qi.onblur = () => setTimeout(() => { sg.hidden = true; qSync(); }, 150);
qi.onfocus = () => { qi.value = ""; qi.oninput(); }; sg.onmousedown = e => e.preventDefault();
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#help").hidden = true; return; }
  if (e.target.matches("input,textarea,select")) return; if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); qi.focus(); return; }
  if (e.key === "?") { help(); return; }
  const t = TABS.find(x => x[2].toLowerCase() === e.key.toLowerCase() || (e.code === "Key" + x[2] && /^[A-Z]$/.test(x[2]))); if (t) { go(t[0]); return; }
  if ((st.tab === "sku" || (st.tab === "rnp" && st.rsub !== "all") || st.tab === "traffic" || st.tab === "comp") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { if (st.tab === "rnp") st.scope = "nm"; const i = D.order.indexOf(st.nm); const nx = D.order[i + (e.key === "ArrowRight" ? 1 : -1)]; if (nx) { const s = D.byNm[nx]; if (st.tab === "traffic") { st.taroma = s.aroma; st.gapnm = nx; } if (st.tab === "comp") st.aroma = s.aroma; go(st.tab, nx); } }
});
boot();
</script>
